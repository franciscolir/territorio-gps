<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gestión de Puntos · RM Chile</title>

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; }
  body { display: flex; flex-direction: column; overflow: hidden; background: #f8fafc; color: #0f172a; }

  /* ============ LOGIN ============ */
  #loginView {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e293b, #0f172a);
  }
  #loginView .card {
    background: #fff; padding: 32px; border-radius: 14px;
    width: 100%; max-width: 380px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  #loginView h1 { font-size: 20px; margin-bottom: 6px; }
  #loginView p.sub { font-size: 13px; color: #64748b; margin-bottom: 20px; }
  #loginView label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .5px; }
  #loginView input {
    width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px;
  }
  #loginView input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
  #loginView button {
    width: 100%; margin-top: 18px; padding: 12px; background: #3b82f6; color: #fff;
    border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #loginView button:hover { background: #2563eb; }
  #loginError { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ============ APP ============ */
  #appView { display: none; flex-direction: column; height: 100%; }

  header {
    background: #fff; border-bottom: 1px solid #e2e8f0;
    padding: 10px 16px; display: flex; gap: 10px; align-items: center;
    flex-wrap: wrap; z-index: 20; box-shadow: 0 1px 3px rgba(0,0,0,.05);
  }
  header .brand { font-weight: 700; font-size: 15px; color: #1e293b; margin-right: 6px; }
  header input, header button {
    padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px;
  }
  header input:focus { outline: 2px solid #3b82f6; }
  header button {
    background: #3b82f6; color: #fff; border: none; cursor: pointer; font-weight: 600;
  }
  header button:hover { background: #2563eb; }
  header button.ghost { background: #f1f5f9; color: #1e293b; }
  header button.ghost:hover { background: #e2e8f0; }
  header button.danger { background: #dc2626; }
  header button.danger:hover { background: #b91c1c; }
  header button.active { background: #f59e0b; color: #fff; }
  header .spacer { flex: 1; }
  header .user { font-size: 12px; color: #64748b; }

  #main { flex: 1; display: flex; position: relative; overflow: hidden; }

  /* ============ SIDEBAR ============ */
  #sidebar {
    width: 340px; background: #fff; border-right: 1px solid #e2e8f0;
    display: flex; flex-direction: column; z-index: 10;
    transition: transform .25s;
  }
  #sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
  #sidebar .panel-head {
    padding: 12px 14px; border-bottom: 1px solid #e2e8f0;
  }
  #sidebar .panel-head h2 { font-size: 14px; margin-top: 12px; margin-bottom: 8px; }
  #sidebar .panel-head select {
    width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 13px; background: #fff;
  }
  #sidebar .panel-head select:focus { outline: 2px solid #3b82f6; }
  #sidebar .panel-head input {
    width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 13px;
  }
  #sidebar .panel-head input:focus { outline: 2px solid #3b82f6; }
  #sidebar .filters { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  #sidebar .filters select {
    flex: 1; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px;
  }
  #list { flex: 1; overflow-y: auto; padding: 8px; }
  .point-card {
    border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px;
    margin-bottom: 8px; cursor: pointer; transition: all .15s;
    background: #fff;
  }
  .point-card:hover { border-color: #3b82f6; box-shadow: 0 2px 8px rgba(59,130,246,.15); }
  .point-card.selected { border-color: #3b82f6; background: #eff6ff; }
  .point-card h3 { font-size: 13px; margin-bottom: 3px; }
  .point-card .meta { font-size: 11px; color: #64748b; line-height: 1.4; }
  .point-card .tag {
    display: inline-block; background: #e0e7ff; color: #3730a3;
    padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600;
    margin-right: 4px; margin-top: 4px;
  }
  .point-card .actions { display: flex; gap: 6px; margin-top: 8px; }
  .point-card .actions button {
    flex: 1; padding: 5px; font-size: 11px; border-radius: 6px;
    border: 1px solid #cbd5e1; background: #f8fafc; cursor: pointer;
  }
  .point-card .actions button:hover { background: #e2e8f0; }
  .point-card .actions button.del { color: #dc2626; }
  .point-card .actions button.del:hover { background: #fee2e2; border-color: #fca5a5; }

  #sidebar .empty { padding: 30px 16px; text-align: center; color: #94a3b8; font-size: 13px; }

  /* ============ SECTORES (lista lateral) ============ */
  #sidebar .sect-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 12px;
  }
  #sidebar .sect-head h2 { margin: 0; }
  #sidebar .sect-head button {
    padding: 4px 9px; font-size: 11px; font-weight: 600;
    border: 1px solid #3b82f6; background: #eff6ff; color: #1d4ed8;
    border-radius: 6px; cursor: pointer;
  }
  #sidebar .sect-head button:hover { background: #dbeafe; }
  #sidebar .sect-head button.active { background: #f59e0b; border-color: #f59e0b; color: #fff; }
  #sectorList { max-height: 160px; overflow-y: auto; margin-top: 6px; }
  #sectorList .empty { font-size: 12px; color: #94a3b8; padding: 6px 2px; }
  .sector-card {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    border: 1px solid #e2e8f0; border-radius: 8px;
    padding: 6px 8px; margin-bottom: 6px; cursor: pointer; background: #fff;
  }
  .sector-card:hover { border-color: #3b82f6; }
  .sector-card .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .sector-card .s-body { flex: 1; min-width: 0; }
  .sector-card .s-body b {
    font-size: 12px; display: block;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sector-card .s-body small { font-size: 10px; color: #64748b; }
  .sector-card .s-actions { display: flex; gap: 2px; }
  .sector-card .s-actions button {
    border: none; background: none; cursor: pointer; font-size: 12px;
    padding: 2px 4px; border-radius: 4px; color: #64748b;
  }
  .sector-card .s-actions button:hover { background: #f1f5f9; }
  .sector-card .palette-row { display: none; width: 100%; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
  .sector-card.editing .palette-row { display: flex; }
  .chip {
    width: 18px; height: 18px; padding: 0; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px #cbd5e1; cursor: pointer;
  }
  .chip.selected { box-shadow: 0 0 0 2px #0f172a; }

  /* ============ TOOLBAR DE DIBUJO ============ */
  #drawToolbar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 10px;
    background: #fff; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: 8px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); z-index: 16;
    max-width: calc(100% - 40px);
  }
  #drawToolbar.visible { display: flex; }
  #drawToolbar .t-label { font-size: 12px; font-weight: 700; color: #334155; }
  #drawPalette { display: flex; gap: 5px; }
  #drawCount {
    font-size: 12px; font-weight: 700; color: #065f46;
    background: #d1fae5; border-radius: 999px; padding: 3px 10px; white-space: nowrap;
  }
  #drawToolbar button {
    font-size: 12px; font-weight: 600; padding: 6px 10px;
    border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 7px; cursor: pointer;
    white-space: nowrap;
  }
  #drawToolbar button:hover { background: #e2e8f0; }
  #drawToolbar button.primary { background: #3b82f6; border-color: #3b82f6; color: #fff; }
  #drawToolbar button.primary:hover { background: #2563eb; }

  /* ============ MAP ============ */
  #map { flex: 1; position: relative; }

  /* ============ REFERENCE PANEL ============ */
  #refPanel {
    position: absolute; bottom: 20px; right: 20px;
    background: #fff; padding: 16px; border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,.15); z-index: 15;
    width: 300px; display: none;
  }
  #refPanel.visible { display: block; }
  #refPanel h3 { font-size: 13px; margin-bottom: 10px; color: #1e293b; }
  #refPanel .coord { font-size: 11px; font-family: monospace; color: #64748b; margin-bottom: 10px; }
  #refPanel label { font-size: 12px; font-weight: 600; color: #475569; display: block; margin-bottom: 6px; }
  #refPanel input[type=range] { width: 100%; }
  #refPanel .radius-val { font-size: 12px; color: #3b82f6; font-weight: 700; }
  #refPanel .close {
    position: absolute; top: 8px; right: 10px; background: none; border: none;
    font-size: 18px; cursor: pointer; color: #94a3b8;
  }
  #refResults { margin-top: 12px; max-height: 200px; overflow-y: auto; }
  #refResults .count {
    font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px;
  }
  #refResults .item {
    padding: 6px 8px; font-size: 12px; border-radius: 6px;
    border: 1px solid #e2e8f0; margin-bottom: 4px; cursor: pointer;
  }
  #refResults .item:hover { background: #eff6ff; border-color: #3b82f6; }
  #refResults .empty { text-align: center; color: #94a3b8; font-size: 12px; padding: 10px; }

  /* ============ MODAL NUEVO SECTOR ============ */
  #sectorModal {
    position: fixed; inset: 0; z-index: 520; background: rgba(15,23,42,.6);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #sectorModal.visible { display: flex; }
  #sectorModal .box {
    background: #fff; border-radius: 14px; padding: 24px;
    width: 100%; max-width: 360px;
  }
  #sectorModal h2 { font-size: 16px; margin-bottom: 12px; }
  #sectorModal .count-badge {
    display: flex; align-items: center; gap: 8px;
    background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af;
    font-size: 13px; font-weight: 700; padding: 10px 12px; border-radius: 8px;
  }
  #sectorModal .swatch { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; }
  #sectorModal label {
    display: block; font-size: 12px; font-weight: 600; color: #475569;
    margin: 12px 0 4px; text-transform: uppercase;
  }
  #sectorModal input {
    width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  #sectorModal input:focus { outline: 2px solid #3b82f6; }
  #sectorModal .err { color: #dc2626; font-size: 13px; min-height: 18px; margin-top: 8px; }
  #sectorModal .buttons { display: flex; gap: 10px; margin-top: 16px; }
  #sectorModal button {
    flex: 1; padding: 11px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; border: none;
  }
  #sectorModal button.primary { background: #3b82f6; color: #fff; }
  #sectorModal button.primary:hover { background: #2563eb; }
  #sectorModal button.secondary { background: #f1f5f9; color: #1e293b; }
  #sectorModal button.secondary:hover { background: #e2e8f0; }

  /* ============ MODAL ============ */
  #modal {
    position: fixed; inset: 0; z-index: 500; background: rgba(15,23,42,.6);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  #modal.visible { display: flex; }
  #modal .box {
    background: #fff; border-radius: 14px; padding: 24px;
    width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  }
  #modal h2 { font-size: 17px; margin-bottom: 16px; }
  #modal label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin: 12px 0 4px; text-transform: uppercase; }
  #modal input, #modal textarea {
    width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1;
    border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  #modal textarea { resize: vertical; min-height: 60px; }
  #modal input:focus, #modal textarea:focus { outline: 2px solid #3b82f6; }
  #modal .row { display: flex; gap: 10px; }
  #modal .row > div { flex: 1; }
  #modal .buttons { display: flex; gap: 10px; margin-top: 20px; }
  #modal button {
    flex: 1; padding: 11px; border-radius: 8px; font-size: 14px;
    font-weight: 600; cursor: pointer; border: none;
  }
  #modal button.primary { background: #3b82f6; color: #fff; }
  #modal button.primary:hover { background: #2563eb; }
  #modal button.secondary { background: #f1f5f9; color: #1e293b; }
  #modal button.secondary:hover { background: #e2e8f0; }
  #modalError { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ============ POPUP MApLibre ============ */
  .maplibregl-popup-content {
    padding: 12px 14px; border-radius: 10px; font-size: 13px;
  }
  .maplibregl-popup-content button {
    margin-top: 8px; padding: 6px 12px; background: #3b82f6;
    color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
  }

  /* ============ TOAST ============ */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px;
    font-size: 13px; z-index: 2000; transition: transform .3s; pointer-events: none;
  }
  #toast.visible { transform: translateX(-50%) translateY(0); }
  #toast.error { background: #dc2626; }

  /* Toggle sidebar */
  #toggleSidebar {
    position: absolute; top: 10px; left: 10px; z-index: 11;
    background: #fff; border: 1px solid #cbd5e1; border-radius: 8px;
    width: 36px; height: 36px; cursor: pointer; font-size: 16px;
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginView">
  <div class="card">
    <h1>Gestión de Puntos</h1>
    <p class="sub">Región Metropolitana · Chile</p>
    <label>Email</label>
    <input id="loginEmail" type="email" autocomplete="username" />
    <label>Contraseña</label>
    <input id="loginPass" type="password" autocomplete="current-password" />
    <button id="loginBtn">Ingresar</button>
    <div id="loginError"></div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appView">
  <header>
    <span class="brand">📍 Puntos RM</span>
    <input id="searchAddr" type="text" placeholder="Buscar dirección…" style="width:220px" />
    <button id="searchBtn" class="ghost">Buscar</button>
    <input id="gmapsLink" type="text" placeholder="Pegar link Google Maps…" style="width:220px" />
    <button id="gmapsBtn" class="ghost">Ir</button>
    <button id="newPointBtn">+ Nuevo punto</button>
    <button id="refBtn" class="ghost">🎯 Modo referencia</button>
    <span class="spacer"></span>
    <span class="user" id="userInfo"></span>
    <button id="logoutBtn" class="ghost">Salir</button>
  </header>

  <div id="main">
    <button id="toggleSidebar" title="Mostrar/ocultar panel">☰</button>

    <aside id="sidebar">
      <div class="panel-head">
        <select id="comunaSel" aria-label="Elegir comuna">
          <option value="">Todas las comunas</option>
        </select>
        <div class="sect-head">
          <h2>Sectores</h2>
          <button id="drawBtn" title="Dibujar un sector a mano">✏️ Dibujar</button>
        </div>
        <div id="sectorList"><div class="empty">Aún no hay sectores</div></div>
        <h2>Puntos</h2>
        <input id="filterText" type="text" placeholder="Filtrar por nombre, dirección…" />
        <div class="filters">
          <select id="filterCat"><option value="">Todas las categorías</option></select>
        </div>
      </div>
      <div id="list"></div>
    </aside>

    <div id="map"></div>

    <div id="refPanel">
      <button class="close" id="refClose">×</button>
      <h3>🎯 Puntos cercanos a referencia</h3>
      <div class="coord" id="refCoord">—</div>
      <label>Radio: <span class="radius-val" id="refRadiusVal">500 m</span></label>
      <input id="refRadius" type="range" min="100" max="5000" step="100" value="500" />
      <div id="refResults"></div>
    </div>

    <div id="drawToolbar">
      <span class="t-label">✏️ Sector</span>
      <span id="drawPalette"></span>
      <span id="drawCount">—</span>
      <button id="drawUndo">Deshacer</button>
      <button id="drawCancel">Cancelar</button>
      <button id="drawClose" class="primary">Cerrar sector</button>
    </div>
  </div>
</div>

<!-- ================= MODAL ================= -->
<div id="modal">
  <div class="box">
    <h2 id="modalTitle">Nuevo punto</h2>
    <label>Nombre *</label>
    <input id="fNombre" type="text" />
    <label>Dirección</label>
    <input id="fDireccion" type="text" />
    <label>Categoría</label>
    <input id="fCategoria" type="text" placeholder="ej: cliente, bodega…" />
    <label>Notas</label>
    <textarea id="fNotas"></textarea>
    <div class="row">
      <div>
        <label>Latitud *</label>
        <input id="fLat" type="number" step="any" />
      </div>
      <div>
        <label>Longitud *</label>
        <input id="fLng" type="number" step="any" />
      </div>
    </div>
    <div id="modalError"></div>
    <div class="buttons">
      <button class="secondary" id="modalCancel">Cancelar</button>
      <button class="primary" id="modalSave">Guardar</button>
    </div>
  </div>
</div>

<!-- ================= MODAL NUEVO SECTOR ================= -->
<div id="sectorModal">
  <div class="box">
    <h2>Nuevo sector</h2>
    <div class="count-badge" id="sectorCount"></div>
    <label>Nombre</label>
    <input id="sectorNombre" type="text" />
    <div class="err" id="sectorErr"></div>
    <div class="buttons">
      <button class="secondary" id="sectorCancelBtn">Cancelar</button>
      <button class="primary" id="sectorSaveBtn">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ============================================================
// CONFIG — EDITA AQUÍ
// ============================================================
const SUPABASE_URL = 'https://yfdkyccmaseztypccoww.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_jmltUeff0VTuLXf2KrujcA_zktLmoSS';

const SANTIAGO_CENTER = [-70.6483, -33.457];
const SANTIAGO_ZOOM = 12;

const MAP_STYLE = 'https://tiles.openfreemap.org/styles/positron';

// ============================================================
// CLIENTE SUPABASE
// ============================================================
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true },
});

// ============================================================
// ESTADO GLOBAL
// ============================================================
let map = null;
let currentUser = null;
let isAdmin = false;
let allPoints = [];
let allComunas = [];
let comunaFeatures = null;
let pointMarkers = {};       // id -> Marker
let tempMarker = null;       // marker temporal al hacer clic
let refMarker = null;        // marker de referencia
let refRadiusTimer = null;   // debounce al cambiar el radio
let refMode = false;         // modo referencia activo
let editingId = null;        // id del punto que se edita
let refResultsIds = new Set();

// --- Sectores (dibujo manual) ---
let allSectores = [];        // sectores cargados de la DB
let drawActive = false;      // ¿modo dibujo activo?
let drawColor = '#3b82f6';   // color del sector en curso
let drawVerts = [];          // vértices [[lng,lat], ...]
let drawHover = null;        // última posición del cursor (goma elástica)
let pendingSector = null;    // polígono cerrado esperando guardado
let sectorHoverId = null;    // sector bajo el cursor
let sectorListError = null;  // mensaje de error al cargar (tabla ausente, etc.)

const SECTOR_COLORS = [
  '#3b82f6', '#10b981', '#f59e0b', '#ef4444',
  '#8b5cf6', '#ec4899', '#14b8a6', '#64748b',
];

// ============================================================
// TOAST
// ============================================================
function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'visible' + (isError ? ' error' : '');
  setTimeout(() => (t.className = ''), 2600);
}

// ============================================================
// LOGIN
// ============================================================
document.getElementById('loginBtn').addEventListener('click', doLogin);
document.getElementById('loginPass').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doLogin();
});

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  const err   = document.getElementById('loginError');
  err.textContent = '';

  const { data, error } = await db.auth.signInWithPassword({ email, password: pass });
  if (error) { err.textContent = error.message; return; }
  currentUser = data.user;
  await afterLogin();
}

async function afterLogin() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('appView').style.display = 'flex';
  document.getElementById('userInfo').textContent = currentUser.email;

  // ¿Es admin?
  const { data: prof } = await db
    .from('profiles')
    .select('is_admin')
    .eq('id', currentUser.id)
    .maybeSingle();
  isAdmin = !!prof?.is_admin;

  // Descarga las comunas ANTES de crear el mapa, para poder encuadrar la
  // cámara en Santiago sin tener que moverla después de cargar la fuente.
  await loadComunas();
  initMap();
}

});

// MAPA
// ============================================================
function initMap() {
  const santiago = allComunas.find((c) => c.nombre === 'Santiago');
  const b = santiago ? boundsFromGeometry(santiago.geom) : null;

  const options = { container: 'map', style: MAP_STYLE };
  if (b && !b.isEmpty()) {
    options.bounds = [[b.getWest(), b.getSouth()], [b.getEast(), b.getNorth()]];
    options.fitBoundsOptions = { padding: 40 };
  } else {
    options.center = SANTIAGO_CENTER;
    options.zoom = SANTIAGO_ZOOM;
  }

  map = new maplibregl.Map(options);
  map.addControl(new maplibregl.NavigationControl(), 'top-right');
  map.addControl(new maplibregl.ScaleControl(), 'bottom-left');

  map.on('load', async () => {
    await ensureComunasLoaded();
    await loadPoints();
    initSectorLayers();
    await loadSectores();
    map.on('click', onMapClick);
    map.on('mousemove', onMapMove);
    map.on('dblclick', onMapDblClick);
  });
}

async function loadComunas() {
  const { data, error } = await db.from('comunas_rm').select('*');
  if (error) { console.error(error); toast('Error cargando comunas', true); return; }

  allComunas = data.map((c) => ({ nombre: c.nombre, geom: c.geom }));
  populateComunaFilter();

  // Construir FeatureCollection
  comunaFeatures = data.map((c) => ({
    type: 'Feature',
    properties: { nombre: c.nombre, codigo: c.codigo_comuna },
    geometry: c.geom, // PostGIS devuelve GeoJSON en la columna geom
  }));
}

// Dibuja la fuente/capas de comunas solo cuando ya existe el mapa
async function ensureComunasLoaded() {
  if (!comunaFeatures) await loadComunas();
  drawComunas();
}

function drawComunas() {
  if (!comunaFeatures || map.getLayer('comunas-fill')) return;

  map.addSource('comunas', {
    type: 'geojson',
    data: { type: 'FeatureCollection', features: comunaFeatures },
  });

  map.addLayer({
    id: 'comunas-fill',
    type: 'fill',
    source: 'comunas',
    paint: {
      'fill-color': '#3b82f6',
      'fill-opacity': 0.06,
    },
  });

  map.addLayer({
    id: 'comunas-outline',
    type: 'line',
    source: 'comunas',
    paint: {
      'line-color': '#1e40af',
      'line-width': 1,
      'line-opacity': 0.7,
    },
  });

  map.addLayer({
    id: 'comunas-labels',
    type: 'symbol',
    source: 'comunas',
    layout: {
      'text-field': ['get', 'nombre'],
      // text-font obligatorio: la pila por defecto (Open Sans) devuelve 404
      // en OpenFreeMap y eso deja TODOS los tiles de la fuente en "errored",
      // destruyendo también los polígonos de fill y outline.
      'text-font': ['Noto Sans Regular'],
      'text-size': 11,
      'text-allow-overlap': false,
    },
    paint: {
      'text-color': '#1e3a8a',
      'text-halo-color': '#ffffff',
      'text-halo-width': 1.5,
    },
  });
}

comunaSel.addEventListener('change', onComunaChange);

function populateComunaFilter() {
  const names = allComunas
    .map((c) => c.nombre)

  comunaSel.innerHTML =
    '<option value="">Todas las comunas</option>' +

}

function onComunaChange() {
  const nombre = comunaSel.value;
  const comuna = allComunas.find((c) => c.nombre === nombre);
  const hayCapas = map && map.getLayer('comunas-fill');

  if (hayCapas) {
    for (const layerId of ['comunas-fill', 'comunas-outline', 'comunas-labels']) {
      if (map.getLayer(layerId)) {
        map.setFilter(layerId, comuna ? ['==', ['get', 'nombre'], nombre] : null);
      }
    }

    if (comuna) {
      map.setPaintProperty('comunas-fill', 'fill-opacity', 0.18);
      map.setPaintProperty('comunas-outline', 'line-color', '#1d4ed8');
      map.setPaintProperty('comunas-outline', 'line-width', 3);
      map.setPaintProperty('comunas-outline', 'line-opacity', 1);
    } else {
      map.setPaintProperty('comunas-fill', 'fill-opacity', 0.06);
      map.setPaintProperty('comunas-outline', 'line-color', '#1e40af');
      map.setPaintProperty('comunas-outline', 'line-width', 1);
      map.setPaintProperty('comunas-outline', 'line-opacity', 0.7);
    }
  }

  populateCategoryFilter();
  renderList();
  renderMarkers();

  // Un sector dibujado queda huérfano si cambias de comuna a mitad de trazo
  if (drawActive) stopDraw();
  updateSectorsSource();
  renderSectorList();

  if (comuna) {
    const b = boundsFromGeometry(comuna.geom);
    if (b && !b.isEmpty()) {
      map.fitBounds(b, { padding: 60, duration: 1200 });
      return;
    }
    toast('No pude calcular los límites de la comuna', true);
  } else {
    fitSantiago(1200);
  }
}

function fitSantiago(duration = 0) {
  const santiago = allComunas.find((c) => c.nombre === 'Santiago');
  const b = santiago ? boundsFromGeometry(santiago.geom) : null;
  if (b && !b.isEmpty()) {
    map.fitBounds(b, { padding: 40, duration });
  } else {
    map.jumpTo({ center: SANTIAGO_CENTER, zoom: SANTIAGO_ZOOM });
  }
}

function boundsFromGeometry(geom) {
  if (!geom || !geom.coordinates) return null;
  const bounds = new maplibregl.LngLatBounds();
  const walk = (coords) => {
    if (typeof coords[0] === 'number') {
      bounds.extend([coords[0], coords[1]]);
      return;
    }
    coords.forEach(walk);
  };
  walk(geom.coordinates);
  return bounds;
}

// ¿El punto (lng, lat) cae dentro del polígono/multipolígono de la comuna?
function pointInGeometry(lng, lat, geom) {
  if (!geom || !geom.coordinates) return false;
  const polygons = geom.type === 'MultiPolygon' ? geom.coordinates : [geom.coordinates];
  return polygons.some(
    (poly) => inRing(lng, lat, poly[0]) && !poly.slice(1).some((hole) => inRing(lng, lat, hole))
  );
}

function inRing(lng, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i];
    const [xj, yj] = ring[j];
    if ((yi > lat) !== (yj > lat) && lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) {
      inside = !inside;
    }
  }
  return inside;
}

// Sectores visibles: solo existen si hay comuna elegida y el punto está dentro
function displayedPoints() {
  const nombre = comunaSel.value;
  if (!nombre) return [];
  const comuna = allComunas.find((c) => c.nombre === nombre);
  if (!comuna) return [];
  return allPoints.filter(
    (p) => p.lat != null && p.lng != null && pointInGeometry(p.lng, p.lat, comuna.geom)
  );
}

async function loadPoints() {
  const { data, error } = await db
    .from('puntos')
    .select('*')
    .is('deleted_at', null);

  if (error) { console.error(error); toast('Error cargando puntos', true); return; }

  // PostGIS devuelve geom como EWKB hex (o GeoJSON); extraemos lat/lng
  allPoints = data.map((p) => {
    const c = pointFromGeom(p.geom);
    return { ...p, lat: c ? c.lat : null, lng: c ? c.lng : null };
  });

  populateCategoryFilter();
  renderList();
  renderMarkers();
  renderSectorList(); // los contadores "N puntos" cambian con cada alta/baja

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// PostGIS devuelve la columna `geography` como EWKB hexadecimal
// (ej: "0101000020E6100000..." = byte order + type con flag SRID + 4326 + X + Y).
// También acepta GeoJSON por si el backend cambia el formato.
function pointFromGeom(geom) {
  if (!geom) return null;

  if (typeof geom === 'object' && Array.isArray(geom.coordinates)) {
    const [lng, lat] = geom.coordinates;
    return isFinite(lat) && isFinite(lng) ? { lat, lng } : null;
  }

  if (typeof geom !== 'string') return null;
  const hex = geom.trim();
  if (!/^[0-9a-fA-F]+$/.test(hex) || hex.length < 18 || hex.length % 2 !== 0) return null;

  try {
    const bytes = new Uint8Array(hex.length / 2);
    for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.slice(i * 2, i * 2 + 2), 16);

    const view = new DataView(bytes.buffer);
    const little = bytes[0] === 1;
    const type = view.getUint32(1, little);
    const baseType = type & 0x1fffffff;          // quita flags EWKB (SRID/Z/M)
    if (baseType !== 1) return null;             // solo Point

    const offset = 5 + ((type & 0x20000000) ? 4 : 0);  // 4 bytes extra si hay SRID
    if (bytes.length < offset + 16) return null;

    const lng = view.getFloat64(offset, little);
    const lat = view.getFloat64(offset + 8, little);
    return isFinite(lat) && isFinite(lng) ? { lat, lng } : null;
  } catch {
    return null;
  }
}

// ============================================================
// MARCADORES EN MAPA
// ============================================================
function renderMarkers() {
  // Limpiar todos
  Object.values(pointMarkers).forEach((m) => m.remove());
  pointMarkers = {};

  // Sectores dentro de la comuna + puntos del modo referencia (aunque estén fuera)
  const visibleIds = new Set(displayedPoints().map((p) => p.id));
  const toShow = allPoints.filter((p) => visibleIds.has(p.id) || refResultsIds.has(p.id));

  toShow.forEach((p) => {
    if (p.lat == null || p.lng == null) return;
    const el = document.createElement('div');
    const inRef = refResultsIds.has(p.id);
    el.style.cssText = `
      width: 18px; height: 18px; border-radius: 50%;
      background: ${inRef ? '#f59e0b' : '#3b82f6'};
      border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3);
      cursor: pointer;
    `;
    const marker = new maplibregl.Marker({ element: el })
      .setLngLat([p.lng, p.lat])
      .setPopup(new maplibregl.Popup().setHTML(`
        <b>${escapeHtml(p.nombre)}</b><br>
        ${p.direccion ? escapeHtml(p.direccion) + '<br>' : ''}
        ${p.categoria ? `<small>${escapeHtml(p.categoria)}</small>` : ''}
      `))
      .addTo(map);
    pointMarkers[p.id] = marker;
  });
}

function focusPoint(id) {
  const p = allPoints.find((x) => x.id === id);
  if (!p) return;
  document.querySelectorAll('.point-card').forEach((el) => {
    el.classList.toggle('selected', el.dataset.id === id);
  });
  if (p.lat == null || p.lng == null) {
    return toast('Este punto no tiene coordenadas válidas', true);
  }
  map.flyTo({ center: [p.lng, p.lat], zoom: Math.max(map.getZoom(), 15) });
  const m = pointMarkers[id];
  if (m) m.togglePopup();
}

// CLIC EN MAPA
// ============================================================
function onMapClick(e) {
  // Modo dibujo: cada clic agrega un vértice del sector
  if (drawActive) { handleDrawClick(e); return; }

  const { lng, lat } = e.lngLat;

  if (refMode) {
    setReferencePoint(lng, lat);
    return;
  }

  // Clic normal: marker temporal + popup
  if (tempMarker) tempMarker.remove();
  const el = document.createElement('div');
  el.style.cssText = `
    width: 22px; height: 22px; border-radius: 50% 50% 50% 0;
    background: #ef4444; border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
    transform: rotate(-45deg);
  `;
  tempMarker = new maplibregl.Marker({ element: el })
    .setLngLat([lng, lat])
    .setPopup(new maplibregl.Popup({ closeButton: true }).setHTML(`
      <b>Punto seleccionado</b><br>
      <small>${lat.toFixed(6)}, ${lng.toFixed(6)}</small><br>
      <button id="popupSaveBtn">Guardar punto aquí</button>
    `))
    .addTo(map)
    .togglePopup();

  // El botón dentro del popup se agrega al DOM después; esperamos un tick
  setTimeout(() => {
    const btn = document.getElementById('popupSaveBtn');
    if (btn) btn.addEventListener('click', () => {
      tempMarker.getPopup().remove();
      openNewModal(lat, lng);
    });
  }, 0);
}

// MODAL NUEVO/EDITAR

const modal = document.getElementById('modal');
document.getElementById('modalCancel').addEventListener('click', closeModal);
document.getElementById('modalSave').addEventListener('click', savePoint);

function openNewModal(lat = null, lng = null) {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Nuevo punto';
  document.getElementById('fNombre').value = '';
  document.getElementById('fDireccion').value = '';
  document.getElementById('fCategoria').value = '';
  document.getElementById('fNotas').value = '';
  document.getElementById('fLat').value = lat ?? '';
  document.getElementById('fLng').value = lng ?? '';
  document.getElementById('modalError').textContent = '';
  modal.classList.add('visible');
}

function openEditModal(id) {
  if (!isAdmin) return toast('Solo administradores pueden editar', true);
  const p = allPoints.find((x) => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Editar punto';
  document.getElementById('fNombre').value = p.nombre || '';
  document.getElementById('fDireccion').value = p.direccion || '';
  document.getElementById('fCategoria').value = p.categoria || '';
  document.getElementById('fNotas').value = p.notas || '';
  document.getElementById('fLat').value = p.lat;
  document.getElementById('fLng').value = p.lng;
  document.getElementById('modalError').textContent = '';
  modal.classList.add('visible');
}

function closeModal() {
  modal.classList.remove('visible');
  editingId = null;
}

async function savePoint() {
  const nombre = document.getElementById('fNombre').value.trim();
  const direccion = document.getElementById('fDireccion').value.trim();
  const categoria = document.getElementById('fCategoria').value.trim();
  const notas = document.getElementById('fNotas').value.trim();
  const lat = parseFloat(document.getElementById('fLat').value);
  const lng = parseFloat(document.getElementById('fLng').value);
  const err = document.getElementById('modalError');

  if (!nombre) { err.textContent = 'El nombre es obligatorio'; return; }
  if (isNaN(lat) || isNaN(lng)) { err.textContent = 'Latitud/longitud inválidas'; return; }
  if (lat < -90 || lat > 90 || lng < -180 || lng > 180) { err.textContent = 'Coordenadas fuera de rango'; return; }

  const { error } = await db.rpc('guardar_punto', {
    p_id: editingId,
    p_nombre: nombre,
    p_direccion: direccion,
    p_categoria: categoria,
    p_notas: notas,
    p_lat: lat,
    p_lng: lng,
  });

  if (error) { err.textContent = error.message; return; }

  closeModal();
  if (tempMarker) { tempMarker.remove(); tempMarker = null; }
  toast(editingId ? 'Punto actualizado' : 'Punto guardado');
  await loadPoints();
}

// ============================================================
// ELIMINAR
// ============================================================
async function deletePoint(id) {
  if (!isAdmin) return toast('Solo administradores pueden eliminar', true);
  const p = allPoints.find((x) => x.id === id);
  if (!confirm(`¿Eliminar "${p?.nombre}"?`)) return;
  const { error } = await db.rpc('eliminar_punto', { p_id: id });
  if (error) return toast(error.message, true);
  toast('Punto eliminado');
  await loadPoints();
}

// ============================================================
// SECTORES: CAPAS, CARGA Y LISTA
// ============================================================
function emptyFC() { return { type: 'FeatureCollection', features: [] }; }

function initSectorLayers() {
  if (!map.getSource('sectores')) {
    map.addSource('sectores', { type: 'geojson', data: emptyFC(), promoteId: 'id' });
  }
  if (!map.getLayer('sectores-fill')) {
    map.addLayer({
      id: 'sectores-fill',
      type: 'fill',
      source: 'sectores',
      paint: {
        'fill-color': ['get', 'color'],
        'fill-opacity': ['case', ['boolean', ['feature-state', 'hover'], false], 0.32, 0.14],
      },
    });
  }
  if (!map.getLayer('sectores-outline')) {
    map.addLayer({
      id: 'sectores-outline',
      type: 'line',
      source: 'sectores',
      paint: {
        'line-color': ['get', 'color'],
        'line-width': ['case', ['boolean', ['feature-state', 'hover'], false], 4, 2],
      },
    });
  }
  if (!map.getLayer('sectores-labels')) {
    map.addLayer({
      id: 'sectores-labels',
      type: 'symbol',
      source: 'sectores',
      layout: {
        'text-field': ['get', 'nombre'],
        // text-font obligatorio: Open Sans da 404 en OpenFreeMap y deja la
        // fuente entera en "errored" (nada de esa fuente se dibuja)
        'text-font': ['Noto Sans Regular'],
        'text-size': 12,
      },
      paint: {
        'text-color': ['get', 'color'],
        'text-halo-color': '#ffffff',
        'text-halo-width': 1.5,
      },
    });
  }

  // Trazo en curso (polígono + línea de goma elástica)
  if (!map.getSource('draw-preview')) {
    map.addSource('draw-preview', { type: 'geojson', data: emptyFC() });
  }
  if (!map.getLayer('draw-fill')) {
    map.addLayer({
      id: 'draw-fill',
      type: 'fill',
      source: 'draw-preview',
      paint: { 'fill-color': drawColor, 'fill-opacity': 0.18 },
    });
  }
  if (!map.getLayer('draw-line')) {
    map.addLayer({
      id: 'draw-line',
      type: 'line',
      source: 'draw-preview',
      paint: { 'line-color': drawColor, 'line-width': 3, 'line-dasharray': [2, 1.5] },
    });
  }

  // Vértices
  if (!map.getSource('draw-verts')) {
    map.addSource('draw-verts', { type: 'geojson', data: emptyFC() });
  }
  if (!map.getLayer('draw-vert-dots')) {
    map.addLayer({
      id: 'draw-vert-dots',
      type: 'circle',
      source: 'draw-verts',
      paint: {
        'circle-radius': ['case', ['==', ['get', 'first'], true], 8, 6],
        'circle-color': drawColor,
        'circle-stroke-color': '#ffffff',
        'circle-stroke-width': 2,
      },
    });
  }
}

function setDrawColor(c) {
  if (!map) return;
  if (map.getLayer('draw-fill')) map.setPaintProperty('draw-fill', 'fill-color', c);
  if (map.getLayer('draw-line')) map.setPaintProperty('draw-line', 'line-color', c);
  if (map.getLayer('draw-vert-dots')) map.setPaintProperty('draw-vert-dots', 'circle-color', c);
}

function ringArea(ring) {
  let sum = 0;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    sum += (ring[j][0] + ring[i][0]) * (ring[j][1] - ring[i][1]);
  }
  return sum / 2;
}

function countPointsInRing(ring) {
  let n = 0;
  for (const p of allPoints) {
    if (p.lat != null && p.lng != null && inRing(p.lng, p.lat, ring)) n++;
  }
  return n;
}

function countPointsInSector(s) {
  const ring = s.geom && s.geom.coordinates && s.geom.coordinates[0];
  return ring ? countPointsInRing(ring) : 0;
}

async function loadSectores() {
  const { data, error } = await db.from('sectores').select('*');
  if (error) {
    console.error('sectores:', error);
    const missing =
      error.code === '42P01' ||
      error.code === 'PGRST205' ||
      /does not exist|could not find the table/i.test(error.message || '');
    sectorListError = missing
      ? 'Falta la tabla: ejecuta la sección 6 de schema.sql en Supabase'
      : 'Error cargando sectores';
    renderSectorList();
    return;
  }
  sectorListError = null;
  allSectores = data || [];
  updateSectorsSource();
  renderSectorList();
}

function sectorsVisible(s) {
  const sel = comunaSel.value;
  return !sel || !s.comuna || s.comuna === sel;
}

function updateSectorsSource() {
  if (!map || !map.getSource('sectores')) return;
  const features = allSectores.filter(sectorsVisible).map((s) => ({
    type: 'Feature',
    properties: {
      id: s.id,
      nombre: s.nombre,
      color: s.color,
      ...(s.comuna ? { comuna: s.comuna } : {}),
    },
    geometry: s.geom,
  }));
  map.getSource('sectores').setData({ type: 'FeatureCollection', features });
}

function renderSectorList() {
  const box = document.getElementById('sectorList');
  if (!box) return;
  const visible = allSectores.filter(sectorsVisible);

  if (!visible.length) {
    box.innerHTML = sectorListError
      ? `<div class="empty">${escapeHtml(sectorListError)}</div>`
      : '<div class="empty">Aún no hay sectores · dibuja uno con ✏️</div>';
    return;
  }

  box.innerHTML = visible.map((s) => {
    const n = countPointsInSector(s);
    const meta = `${n} punto${n === 1 ? '' : 's'}${s.comuna ? ' · ' + escapeHtml(s.comuna) : ''}`;
    return `
      <div class="sector-card" data-id="${s.id}">
        <span class="dot" style="background:${escapeHtml(s.color || '#3b82f6')}"></span>
        <div class="s-body">
          <b>${escapeHtml(s.nombre)}</b>
          <small>${meta}</small>
        </div>
        ${isAdmin ? `
          <div class="s-actions">
            <button class="rename" title="Renombrar">✎</button>
            <button class="color" title="Cambiar color">🎨</button>
            <button class="del" title="Eliminar">🗑</button>
          </div>` : ''}
        <div class="palette-row">
          ${SECTOR_COLORS.map((c) => `
            <button class="chip${c === s.color ? ' selected' : ''}" data-color="${c}"
                    style="background:${c}" title="Color"></button>`).join('')}
        </div>
      </div>`;
  }).join('');

  box.querySelectorAll('.sector-card').forEach((el) => {
    const id = el.dataset.id;
    el.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      focusSector(id);
    });
    el.addEventListener('mouseenter', () => setSectorHover(id, true));
    el.addEventListener('mouseleave', () => {
      setSectorHover(id, false);
      el.classList.remove('editing');
    });

    const ren = el.querySelector('.rename');
    const col = el.querySelector('.color');
    const del = el.querySelector('.del');
    if (ren) ren.addEventListener('click', (e) => { e.stopPropagation(); renameSector(id); });
    if (col) col.addEventListener('click', (e) => { e.stopPropagation(); el.classList.toggle('editing'); });
    if (del) del.addEventListener('click', (e) => { e.stopPropagation(); deleteSector(id); });

    el.querySelectorAll('.palette-row .chip').forEach((chip) => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        changeSectorColor(id, chip.dataset.color);
      });
    });
  });
}

function setSectorHover(id, on) {
  if (!map || !map.getSource('sectores') || !id) return;
  map.setFeatureState({ source: 'sectores', id }, { hover: on });
}

function focusSector(id) {
  const s = allSectores.find((x) => x.id === id);
  if (!s || !s.geom) return;
  const b = boundsFromGeometry(s.geom);
  if (b && !b.isEmpty()) map.fitBounds(b, { padding: 60, duration: 800 });
}

async function renameSector(id) {
  if (!isAdmin) return toast('Solo administradores pueden editar sectores', true);
  const s = allSectores.find((x) => x.id === id);
  if (!s) return;
  const nombre = prompt('Nombre del sector:', s.nombre);
  if (nombre === null) return;
  const trimmed = nombre.trim();
  if (!trimmed || trimmed === s.nombre) return;
  const { error } = await db.from('sectores').update({ nombre: trimmed }).eq('id', id);
  if (error) return toast(error.message, true);
  await loadSectores();
}

async function changeSectorColor(id, color) {
  if (!isAdmin) return toast('Solo administradores pueden editar sectores', true);
  const { error } = await db.from('sectores').update({ color }).eq('id', id);
  if (error) return toast(error.message, true);
  await loadSectores();
}

async function deleteSector(id) {
  if (!isAdmin) return toast('Solo administradores pueden eliminar sectores', true);
  const s = allSectores.find((x) => x.id === id);
  if (!confirm(`¿Eliminar "${s?.nombre}"?`)) return;
  const { error } = await db.from('sectores').delete().eq('id', id);
  if (error) return toast(error.message, true);
  toast('Sector eliminado');
  await loadSectores();
}

// ============================================================
// DIBUJO DE SECTORES
// ============================================================
function startDraw() {
  if (drawActive) { stopDraw(); return; }

  drawActive = true;
  drawVerts = [];
  drawHover = null;
  pendingSector = null;

  // El modo referencia pisaría el primer clic: lo apagamos
  if (refMode) {
    refMode = false;
    document.getElementById('refBtn').classList.remove('active');
    document.getElementById('refBtn').textContent = '🎯 Modo referencia';
    clearReference();
  }

  document.getElementById('sectorModal').classList.remove('visible');
  document.getElementById('drawToolbar').classList.add('visible');
  document.getElementById('drawBtn').classList.add('active');
  map.doubleClickZoom.disable();
  map.getCanvas().style.cursor = 'crosshair';
  updateDraw();
  toast('Clic para agregar vértices · doble clic o primer vértice para cerrar');
}

function stopDraw() {
  drawActive = false;
  drawVerts = [];
  drawHover = null;
  pendingSector = null;

  if (map) {
    if (map.getSource('draw-preview')) map.getSource('draw-preview').setData(emptyFC());
    if (map.getSource('draw-verts')) map.getSource('draw-verts').setData(emptyFC());
    map.doubleClickZoom.enable();
    map.getCanvas().style.cursor = '';
  }
  document.getElementById('sectorModal').classList.remove('visible');
  document.getElementById('drawToolbar').classList.remove('visible');
  document.getElementById('drawBtn').classList.remove('active');
  document.getElementById('drawCount').textContent = '—';
}

function distPx(a, point) {
  const p = map.project(a);
  return Math.hypot(p.x - point.x, p.y - point.y);
}

function updateDraw() {
  if (!map || !map.getSource('draw-preview')) return;

  const line = drawHover && drawVerts.length ? drawVerts.concat([drawHover]) : drawVerts.slice();

  const preview = [];
  if (line.length >= 2) {
    preview.push({ type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: line } });
    if (line.length >= 3) {
      preview.push({
        type: 'Feature',
        properties: {},
        geometry: { type: 'Polygon', coordinates: [line.concat([line[0]])] },
      });
    }
  }
  map.getSource('draw-preview').setData({ type: 'FeatureCollection', features: preview });

  map.getSource('draw-verts').setData({
    type: 'FeatureCollection',
    features: drawVerts.map((c, i) => ({
      type: 'Feature',
      properties: { first: i === 0 },
      geometry: { type: 'Point', coordinates: c },
    })),
  });

  // Contador en vivo: puntos que caerían dentro del sector
  const badge = document.getElementById('drawCount');
  if (line.length >= 3) {
    const n = countPointsInRing(line);
    badge.textContent = `${n} punto${n === 1 ? '' : 's'}`;
  } else {
    badge.textContent = '—';
  }
}

function handleDrawClick(e) {
  // Con el modal abierto el mapa queda "congelado" (evita vértices fantasma)
  if (document.getElementById('sectorModal').classList.contains('visible')) return;

  const pt = [e.lngLat.lng, e.lngLat.lat];

  // Clic sobre el primer vértice = cerrar el sector
  if (drawVerts.length >= 3 && distPx(drawVerts[0], e.point) <= 12) {
    drawHover = null;
    closeDraw();
    return;
  }

  drawVerts.push(pt);
  updateDraw();
}

function onMapMove(e) {
  if (drawActive) {
    drawHover = [e.lngLat.lng, e.lngLat.lat];
    map.getCanvas().style.cursor = 'crosshair';
    updateDraw();
    return;
  }

  const hasLayer = map.getLayer('sectores-fill');
  const feats = hasLayer ? map.queryRenderedFeatures(e.point, { layers: ['sectores-fill'] }) : [];
  const id = feats.length ? feats[0].properties.id : null;

  if (id !== sectorHoverId) {
    setSectorHover(sectorHoverId, false);
    setSectorHover(id, true);
    sectorHoverId = id;
  }
  map.getCanvas().style.cursor = id ? 'pointer' : '';
}

function onMapDblClick(e) {
  if (!drawActive) return;
  if (document.getElementById('sectorModal').classList.contains('visible')) return;
  e.preventDefault();

  // Los clics previos al doble clic dejaron vértices repetidos en la misma
  // ubicación: los quitamos (solo si son duplicados entre sí)
  while (
    drawVerts.length >= 4 &&
    distPx(drawVerts[drawVerts.length - 1], e.point) <= 12 &&
    distPx(drawVerts[drawVerts.length - 1], map.project(drawVerts[drawVerts.length - 2])) <= 12
  ) {
    drawVerts.pop();
  }
  drawHover = null;
  closeDraw();
}

function closeDraw() {
  if (drawVerts.length < 3) {
    toast('Necesitas al menos 3 vértices para cerrar un sector', true);
    return;
  }

  const ring = drawVerts.concat([drawVerts[0]]);
  if (Math.abs(ringArea(ring)) < 1e-11) {
    toast('El polígono es demasiado pequeño', true);
    return;
  }

  const count = countPointsInRing(ring);
  pendingSector = { ring, color: drawColor, comuna: comunaSel.value || null, count };

  document.getElementById('sectorNombre').value = `Sector ${allSectores.length + 1}`;
  document.getElementById('sectorCount').innerHTML =
    `<span class="swatch" style="background:${escapeHtml(drawColor)}"></span>` +
    `${count} punto${count === 1 ? '' : 's'} incluido${count === 1 ? '' : 's'}`;
  document.getElementById('sectorErr').textContent = '';
  document.getElementById('sectorModal').classList.add('visible');

  drawHover = null;
  updateDraw();
}

async function saveSector() {
  if (!pendingSector) return;
  const err = document.getElementById('sectorErr');
  const nombre =
    document.getElementById('sectorNombre').value.trim() || `Sector ${allSectores.length + 1}`;

  const { error } = await db.from('sectores').insert({
    comuna: pendingSector.comuna,
    nombre,
    color: pendingSector.color,
    geom: { type: 'Polygon', coordinates: [pendingSector.ring] },
    created_by: currentUser.id,
  });
  if (error) { err.textContent = error.message; return; }

  const n = pendingSector.count;
  pendingSector = null;
  document.getElementById('sectorModal').classList.remove('visible');
  stopDraw();
  toast(`Sector guardado · ${n} punto${n === 1 ? '' : 's'} incluido${n === 1 ? '' : 's'}`);
  await loadSectores();
}

// --- Toolbar y atajos ---
const drawPalette = document.getElementById('drawPalette');
SECTOR_COLORS.forEach((c) => {
  const chip = document.createElement('button');
  chip.className = 'chip' + (c === drawColor ? ' selected' : '');
  chip.style.background = c;
  chip.title = 'Color del sector';
  chip.addEventListener('click', () => {
    drawColor = c;
    drawPalette.querySelectorAll('.chip').forEach((x) => x.classList.remove('selected'));
    chip.classList.add('selected');
    setDrawColor(c);
  });
  drawPalette.appendChild(chip);
});

document.getElementById('drawBtn').addEventListener('click', startDraw);
document.getElementById('drawUndo').addEventListener('click', () => { drawVerts.pop(); updateDraw(); });
document.getElementById('drawCancel').addEventListener('click', () => stopDraw());
document.getElementById('drawClose').addEventListener('click', () => { drawHover = null; closeDraw(); });
document.getElementById('sectorCancelBtn').addEventListener('click', () => {
  pendingSector = null;
  document.getElementById('sectorModal').classList.remove('visible');
});
document.getElementById('sectorSaveBtn').addEventListener('click', saveSector);

document.addEventListener('keydown', (e) => {
  const typing = e.target && e.target.matches && e.target.matches('input, textarea');

  if (e.key === 'Escape') {
    if (document.getElementById('sectorModal').classList.contains('visible')) {
      pendingSector = null;
      document.getElementById('sectorModal').classList.remove('visible');
      return;
    }
    if (drawActive) stopDraw();
    return;
  }

  if (!typing && drawActive && (e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    drawVerts.pop();
    updateDraw();
  }
});


// ============================================================
// BUSCAR DIRECCIÓN (Nominatim)
// ============================================================
document.getElementById('searchBtn').addEventListener('click', searchAddress);
document.getElementById('searchAddr').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') searchAddress();
});

async function searchAddress() {
  const q = document.getElementById('searchAddr').value.trim();
  if (!q) return;
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q=${encodeURIComponent(q)}`;
  try {
    const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
    const data = await res.json();
    if (!data.length) return toast('Dirección no encontrada', true);
    const { lat, lon, display_name } = data[0];
    map.flyTo({ center: [parseFloat(lon), parseFloat(lat)], zoom: 16 });
    openNewModal(parseFloat(lat), parseFloat(lon));
    document.getElementById('fDireccion').value = display_name;
  } catch (e) {
    toast('Error en la búsqueda', true);
  }
}

// ============================================================
// GOOGLE MAPS LINK PARSER
// ============================================================
document.getElementById('gmapsBtn').addEventListener('click', parseGmapsLink);

function parseGmapsLink() {
  const url = document.getElementById('gmapsLink').value.trim();
  if (!url) return;

  let lat = null, lng = null;

  // Formato: /@lat,lng,zoomz
  let m = url.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
  if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }

  // Formato: ?q=lat,lng  o  &q=lat,lng
  if (lat === null) {
    m = url.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/);
    if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
  }

  // Formato: ?ll=lat,lng
  if (lat === null) {
    m = url.match(/[?&]ll=(-?\d+\.\d+),(-?\d+\.\d+)/);
    if (m) { lat = parseFloat(m[1]); lng = parseFloat(m[2]); }
  }

  if (lat === null || lng === null) {
    return toast('No pude extraer coordenadas del link', true);
  }

  map.flyTo({ center: [lng, lat], zoom: 16 });
  openNewModal(lat, lng);
}

// ============================================================
// MODO REFERENCIA
// ============================================================
const refBtn = document.getElementById('refBtn');
const refPanel = document.getElementById('refPanel');
const refRadius = document.getElementById('refRadius');
const refRadiusVal = document.getElementById('refRadiusVal');

refBtn.addEventListener('click', () => {
  refMode = !refMode;
  refBtn.classList.toggle('active', refMode);
  refBtn.textContent = refMode ? '🎯 Modo referencia (activo)' : '🎯 Modo referencia';
  if (!refMode) {
    clearReference();
  } else {
    toast('Haz clic en el mapa para marcar la referencia');
  }
});

document.getElementById('refClose').addEventListener('click', () => {
  clearReference();
  refMode = false;
  refBtn.classList.remove('active');
  refBtn.textContent = '🎯 Modo referencia';
});

refRadius.addEventListener('input', () => {
  const r = parseInt(refRadius.value);
  refRadiusVal.textContent = r >= 1000 ? (r / 1000).toFixed(1) + ' km' : r + ' m';
  if (!refMarker) return;
  updateRefCircle();
  clearTimeout(refRadiusTimer);
  refRadiusTimer = setTimeout(() => {
    if (!refMarker) return;
    const c = refMarker.getLngLat();
    searchInRadius(c.lat, c.lng, r);
  }, 250);
});

function setReferencePoint(lng, lat) {
  if (refMarker) refMarker.remove();

  const el = document.createElement('div');
  el.style.cssText = `
    width: 22px; height: 22px; border-radius: 50%;
    background: #f59e0b; border: 3px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  `;
  refMarker = new maplibregl.Marker({ element: el })
    .setLngLat([lng, lat])
    .addTo(map);

  document.getElementById('refCoord').textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
  refPanel.classList.add('visible');
  updateRefCircleAndSearch();
}

function updateRefCircle() {
  if (!refMarker) return null;
  const center = refMarker.getLngLat();
  const radius = parseInt(refRadius.value);

  // Círculo (reemplaza la fuente si ya existe)
  if (map.getLayer('ref-circle-fill')) map.removeLayer('ref-circle-fill');
  if (map.getLayer('ref-circle-line')) map.removeLayer('ref-circle-line');
  if (map.getSource('ref-circle')) map.removeSource('ref-circle');

  const circleGeoJSON = createCircle(center.lng, center.lat, radius);
  map.addSource('ref-circle', { type: 'geojson', data: circleGeoJSON });
  map.addLayer({
    id: 'ref-circle-fill',
    type: 'fill',
    source: 'ref-circle',
    paint: { 'fill-color': '#f59e0b', 'fill-opacity': 0.12 },
  });
  map.addLayer({
    id: 'ref-circle-line',
    type: 'line',
    source: 'ref-circle',
    paint: { 'line-color': '#f59e0b', 'line-width': 2, 'line-dasharray': [3,2] },
  });

  return { center, radius };
}

function updateRefCircleAndSearch() {
  const ctx = updateRefCircle();
  if (ctx) searchInRadius(ctx.center.lat, ctx.center.lng, ctx.radius);
}

function createCircle(lng, lat, radiusMeters) {
  const points = 64;
  const coords = [];
  const distanceX = radiusMeters / (111320 * Math.cos((lat * Math.PI) / 180));
  const distanceY = radiusMeters / 110540;
  for (let i = 0; i < points; i++) {
    const theta = (i / points) * (2 * Math.PI);
    coords.push([lng + distanceX * Math.cos(theta), lat + distanceY * Math.sin(theta)]);
  }
  coords.push(coords[0]);
  return { type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] }, properties: {} };
}

async function searchInRadius(lat, lng, radio) {
  const { data, error } = await db.rpc('puntos_en_radio', {
    lat, lng, radio_m: radio,
  });

  const results = document.getElementById('refResults');
  if (error) { results.innerHTML = `<div class="empty">Error: ${error.message}</div>`; return; }

  refResultsIds = new Set((data || []).map((p) => p.id));
  renderMarkers();
  renderList();

  if (!data || !data.length) {
    results.innerHTML = '<div class="empty">Sin direcciones cercanas</div>';
    return;
  }

  results.innerHTML =
    `<div class="count">${data.length} punto${data.length === 1 ? '' : 's'} en radio</div>` +
    data.map((p) => `
    <div class="item" data-id="${p.id}">
      <b>${escapeHtml(p.nombre)}</b><br>
      <small>${escapeHtml(p.direccion || '')}</small>
    </div>
  `).join('');

  results.querySelectorAll('.item').forEach((el) => {
    el.addEventListener('click', () => focusPoint(el.dataset.id));
  });
}

function clearReference() {
  if (refMarker) { refMarker.remove(); refMarker = null; }
  if (map.getLayer('ref-circle-fill')) map.removeLayer('ref-circle-fill');
  if (map.getLayer('ref-circle-line')) map.removeLayer('ref-circle-line');
  if (map.getSource('ref-circle')) map.removeSource('ref-circle');
  refPanel.classList.remove('visible');
  refResultsIds = new Set();
  renderMarkers();
  renderList();
}
